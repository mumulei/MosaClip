name: Developer ID notarized release build

# Production distribution pipeline: builds MosaClip.app, signs it with the
# repository's Developer ID Application certificate (hardened runtime +
# secure timestamp), produces the DMG, notarizes it via notarytool, staples
# the ticket, verifies Gatekeeper acceptance and uploads the artifact.
#
# This workflow NEVER publishes a GitHub Release and never enables the online
# updater (ReleaseIdentity.onlineUpdatesEnabled stays false). Distribution of
# the produced DMG is an explicit, separate human decision (P3+).
#
# Required repository secrets (names only — values are never logged):
#   DEVELOPER_ID_APPLICATION_P12_BASE64  base64-encoded Developer ID Application .p12
#   DEVELOPER_ID_APPLICATION_P12_PASSWORD password of that .p12
#   APPLE_TEAM_ID                        Apple Developer Team ID (cross-check)
#   APPLE_API_KEY_ID                     App Store Connect API key ID (notarytool)
#   APPLE_API_ISSUER_ID                  App Store Connect API issuer ID
#   APPLE_API_KEY_P8_BASE64              base64-encoded .p8 private key (notarytool)
#
# Every gate below is fail closed: identity mismatch, unsigned helper,
# missing hardened runtime/timestamp, notarization != Accepted, stapler or
# Gatekeeper failure all abort the job without uploading any artifact.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (defaults to the VERSION file)'
        required: false
        type: string
      arch:
        description: 'Target architecture'
        required: false
        type: choice
        default: arm64
        options:
          - arm64
          - x86_64

permissions:
  contents: read

concurrency:
  group: developer-id-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
      VERSION: ${{ inputs.version || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun notarytool --version
          xcrun stapler 2>&1 | head -1
          sw_vers

      - name: Run test suite
        run: swift test

      - name: Assert signing and notarization secrets are configured
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          : "${DEVELOPER_ID_APPLICATION_P12_BASE64:?secret DEVELOPER_ID_APPLICATION_P12_BASE64 is not configured}"
          : "${DEVELOPER_ID_APPLICATION_P12_PASSWORD:?secret DEVELOPER_ID_APPLICATION_P12_PASSWORD is not configured}"
          : "${APPLE_TEAM_ID:?secret APPLE_TEAM_ID is not configured}"
          : "${APPLE_API_KEY_ID:?secret APPLE_API_KEY_ID is not configured}"
          : "${APPLE_API_ISSUER_ID:?secret APPLE_API_ISSUER_ID is not configured}"
          : "${APPLE_API_KEY_P8_BASE64:?secret APPLE_API_KEY_P8_BASE64 is not configured}"
          echo "All required signing/notarization secrets are present."

      - name: Import Developer ID certificate into temporary keychain
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/mosaclip-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_P12="$RUNNER_TEMP/developerid.p12"
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode -o "$CERT_P12"
          security import "$CERT_P12" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_P12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$(security list-keychain -d user | tr -d '"' | grep -v mosaclip-build | tr '\n' ' ')"

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple and verify DMG
        env:
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Unlock once more for codesign access from a non-interactive shell.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          bash .github/scripts/ci-build-dmg.sh

      - name: Upload notarized DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosaClip-${{ inputs.version || 'from-version-file' }}-${{ inputs.arch || 'arm64' }}-notarized
          path: |
            dist/*.dmg
            dist/checksums.txt
            dist/release-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean up temporary signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null || true
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
