<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://mumulei.dpdns.org/mosaclip/" />
    <meta name="theme-color" content="#f5f5f5" />
    <script>
      (() => {
        let mode = "system";
        try { const stored = localStorage.getItem("mosaclip-site-theme"); if (["light", "dark"].includes(stored)) mode = stored; } catch {}
        document.documentElement.dataset.themePreference = mode;
        document.documentElement.dataset.theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
      })();
    </script>
    <meta
      name="description"
      content="MosaClip，你的 macOS 本地剪贴板工作区。留住文字、链接、代码与灵感，一个快捷键，随时回到手边。"
    />
    <link rel="preconnect" href="https://cdn-font.hyperos.mi.com" />
    <link rel="preconnect" href="https://cdn-file.hyperos.mi.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn-font.hyperos.mi.com/font/css?family=MiSans_VF:VF:Chinese_Simplify,Latin&amp;display=swap"
    />
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (() => {
        const browserScheme = matchMedia("(prefers-color-scheme: dark)");
        const updateIcon = () => {
          document.getElementById("site-favicon").href = browserScheme.matches ? "%BASE_URL%favicon-dark.svg" : "%BASE_URL%favicon-light.svg";
        };
        updateIcon();
        browserScheme.addEventListener("change", updateIcon);
      })();
    </script>
    <title>MosaClip — 复制的每一刻，都能随时回到手边。</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
